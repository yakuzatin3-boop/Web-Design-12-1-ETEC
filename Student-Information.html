<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    

    <form style="width: 300px; margin: auto;">

        <h1><i><u>Student Information</u></i></h1>

        <p>Enter Your Information</p>

        <label >Enter FullName </label><br>
        <input type="text" name="name"><br><br>

        <label>Enter Email</label><br>
        <input type="email" name="email"><br><br>

        <label>Gender</label><br>
        <input type="checkbox" name="male">
        <label >Male</label>

        <input type="checkbox" name="female">
        <label >Female</label><br><br>

        <label >Date of birth : </label>
        <input type="date" name="date"><br><br>

        <label>Which one is your skill?</label><br>
        <input type="radio" name="Program">
        <label >Program</label>

        <input type="radio" name="network">
        <label >Network</label><br><br>

        <label>Top of Tech-skill</label><br><br>

        <label>C++ : 82% </label>
        <input type="range" name="c++" value="82"><br>

        <label>C : 82% </label>
        <input type="range" name="c" value="82"><br>

        <label>Java Script : 2% </label>
        <input type="range" name="c" value="2"><br>

    </form>

</body>
</html>
