<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background-image: url("https://i.pinimg.com/736x/55/4e/71/554e712e7c4f94b1c0ba9d03e9c26538.jpg");
            background-repeat: no-repeat;
            background-size: cover;
        }
        .form{
            width: 350px;
            margin:90px auto;
            padding: 60px;
            background-color: rgba(46, 46, 47, 0.714);
            border: 1px solid gray;
            border-radius: 20px;
        }
        .title-contact{
            color: rgb(235, 99, 14);
            font-size: 35px;
            text-align: center;
        }
        .sub-title{
            color: aliceblue;
            text-align: center;
        }
        .label-input{
            color: aliceblue;
            font-size: 25px;
        }
        .input-form{
            width: 98%;
            border: none;
            border-radius: 30px;
            font-style: italic;
            font-size: 20px;
            background-color: rgba(152, 153, 154, 0.568);
            box-shadow: 1px 0px 10px 11px rgba(21, 21, 20, 0.371) inset;
            padding: 10px;
            color: aliceblue;
        }
        
    </style>
    
</head>
<body >

    <form action="" class="form">
        <h1 class="title-contact">Contact for more</h1>
        <p class="sub-title"><i>Please contact for more.</i> <br>
          Can contact if you have something to me.</p>

        <label class="label-input">First Name</label><br>
        <input class="input-form" type="text" name="name" id=""><br><br>

        <label class="label-input">Last Name</label><br>
        <label class="label-input">Email Address</label><br>
        <label class="label-input">Contact Message</label><br>
        <textarea name="message" id=""></textarea>
    </form>
    
</body>
</html>
